<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Memória Potiguar</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#3f2a1d;
}


nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:#2b1d14;
    color:white;
}

.logo{
    font-weight:bold;
    font-size:20px;
}

.menu a{
    margin-left: 25px;
    text-decoration: none;
    color: white;
    font-weight: 500;
}

.menu a:hover{
    color: #fde68a;
}

.btn-contato{
    background:#92400e;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    text-decoration:none;
}

/* HERO */
.hero{
    margin:20px;
    border-radius:0;
    padding:60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:70vh;

    background:
    linear-gradient(rgba(63,42,29,0.75), rgba(63,42,29,0.9)),
    url("/static/img/fundo0.jpg");

    background-size:cover;
    background-repeat:no-repeat;
    background-position:center bottom;
    color:white;

    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.texto{
    max-width:500px;
}

.texto h1{
    font-size:40px;
    margin-bottom:20px;
}

.texto p{
    margin-bottom:30px;
    color:#e7d3c0;
}

.btn{
    padding:12px 20px;
    border-radius:25px;
    margin-right:10px;
    display:inline-block;
    text-decoration:none;
}

/* botões */
.btn1{
    background:#e7d3c0;
    color:#3f2a1d;
}

.btn2{
    background:#92400e;
    color:white;
}

.btn1:hover{
    background:#d6bfa7;
}

.btn2:hover{
    background:#78350f;
}

/* imagem lateral */
.imagem img{
    width:250px;
    filter:drop-shadow(0 5px 10px rgba(0,0,0,0.4));
}


@media (max-width: 768px){
    .hero{
        flex-direction:column;
        text-align:center;
    }

    .imagem img{
        margin-top:20px;
        width:200px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">Memória Potiguar</div>

    <div class="menu">
        <a href="index.html">Início</a>
        <a href="categorias.html">Categorias</a>
        <a href="sobre.html">Sobre</a>
    </div>

</nav>

<section class="hero">
    <div class="texto">
        <h1>Vivencie a Cultura Potiguar</h1>
        <p>Descubra sabores, histórias e lugares que fazem do Rio Grande do Norte um lugar único!</p>

        <a href="{{ url_for('cadastro') }}" class="btn btn1">Começar</a>
        <a href="{{ url_for('login') }}" class="btn btn2">Entrar</a>
    </div>

    <div class="imagem">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
    </div>
</section>

</body>
</html>
