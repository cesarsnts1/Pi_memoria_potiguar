<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Memória Potiguar</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:#f5e6d3;
}

/* NAVBAR IGUAL À SOBRE */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:#92400e;
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
}

.logo{
    font-weight:700;
    font-size:20px;
    color:white;
}

nav a{
    margin-left:25px;
    text-decoration:none;
    color:white;
}

nav a:hover{
    color:#fde68a;
}

.logout{
    background:#ef4444;
    padding:8px 18px;
    border-radius:20px;
}

/* ESPAÇO PRA NAVBAR FIXA */
.spacer{
    height:80px;
}

/* HERO */
.hero{
    margin:20px;
    padding:60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:75vh;

    background:
    linear-gradient(rgba(146,64,14,0.7), rgba(146,64,14,0.9)),
    url("/static/img/fundo0.jpg");

    background-size:cover;
    background-position:center;

    color:white;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.texto{
    max-width:500px;
}

.texto h1{
    font-size:40px;
    margin-bottom:20px;
}

.texto p{
    margin-bottom:30px;
    color:#fdebdc;
}

.btn{
    padding:12px 20px;
    border-radius:25px;
    margin-right:10px;
    display:inline-block;
    text-decoration:none;
}

.btn1{
    background:#f5e6d3;
    color:#92400e;
}

.btn1:hover{
    background:#e8d5be;
}

.btn2{
    background:#78350f;
    color:white;
}

.btn2:hover{
    background:#5a2e1f;
}

.imagem img{
    width:250px;
    filter:drop-shadow(0 5px 10px rgba(0,0,0,0.4));
}

/* RESPONSIVO */
@media (max-width: 768px){
    .hero{
        flex-direction:column;
        text-align:center;
        height:auto;
    }

    .imagem img{
        margin-top:20px;
        width:200px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Memória Potiguar</div>
    <nav>
        <a href="/index">Início</a>
        <a href="/categorias">Categorias</a>
        <a href="/sobre">Sobre</a>
        <a href="/login" class="logout">Sair</a>
    </nav>
</header>

<div class="spacer"></div>

<section class="hero">
    <div class="texto">
        <h1>Vivencie a Cultura Potiguar!</h1>
        <p>Descubra sabores, histórias e lugares que fazem do Rio Grande do Norte um lugar único!</p>

        <a href="{{ url_for('cadastro') }}" class="btn btn1">Começar</a>
        <a href="{{ url_for('login') }}" class="btn btn2">Entrar</a>
    </div>

    <div class="imagem">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
    </div>
</section>

</body>
</html>
